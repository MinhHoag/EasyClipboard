<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-label="How EasyClipboard moves your clipboard between iPhone and PC">
<rect width="780" height="400" rx="20" fill="#f2f2f7"/>
<text x="150" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#1c1c1e" text-anchor="middle">iPhone</text>
<text x="630" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#1c1c1e" text-anchor="middle">Windows PC</text>
<rect x="318" y="56" width="144" height="290" rx="14" fill="#e8f1ff" stroke="#007AFF" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="390" y="80" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#007AFF" text-anchor="middle">Tailscale</text>
<text x="390" y="97" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#007AFF" text-anchor="middle">your private network,</text>
<text x="390" y="111" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#007AFF" text-anchor="middle">encrypted, any Wi-Fi</text>
<text x="390" y="125" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#007AFF" text-anchor="middle">or cellular</text>
<text x="24" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#6e6e73" text-anchor="start">SEND  (iPhone → PC)</text>
<rect x="20" y="160" width="132" height="74" rx="12" fill="#ffffff" stroke="#d1d1d6" stroke-width="1.2"/><text x="34" y="185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1c1c1e" text-anchor="start">Copy</text><text x="34" y="206" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">text or a photo</text><text x="34" y="223" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">on your iPhone</text>
<rect x="168" y="160" width="140" height="74" rx="12" fill="#ffffff" stroke="#d1d1d6" stroke-width="1.2"/><rect x="180" y="174" width="12" height="12" rx="3" fill="#8FAE97"/><text x="200" y="185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1c1c1e" text-anchor="start">ECSend</text><text x="182" y="206" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">Shortcut that sends</text><text x="182" y="223" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">your clipboard</text>
<rect x="472" y="160" width="150" height="74" rx="12" fill="#ffffff" stroke="#d1d1d6" stroke-width="1.2"/><text x="486" y="185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1c1c1e" text-anchor="start">EasyClipboard</text><text x="486" y="206" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">saves it to history,</text><text x="486" y="223" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">puts it on clipboard</text>
<rect x="636" y="160" width="124" height="74" rx="12" fill="#ffffff" stroke="#d1d1d6" stroke-width="1.2"/><text x="650" y="185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1c1c1e" text-anchor="start">Ctrl+V</text><text x="650" y="206" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">paste in</text><text x="650" y="223" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">any app</text>
<line x1="152" y1="197" x2="159" y2="197" stroke="#1c1c1e" stroke-width="2"/><path d="M168 197 l-10 -5 v10 z" fill="#1c1c1e"/>
<line x1="308" y1="197" x2="463" y2="197" stroke="#007AFF" stroke-width="2"/><path d="M472 197 l-10 -5 v10 z" fill="#007AFF"/>
<line x1="622" y1="197" x2="627" y2="197" stroke="#1c1c1e" stroke-width="2"/><path d="M636 197 l-10 -5 v10 z" fill="#1c1c1e"/>
<text x="390" y="186" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#1c1c1e" text-anchor="middle">text: direct</text>
<text x="390" y="214" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#1c1c1e" text-anchor="middle">photos: Taildrop</text>
<text x="24" y="262" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#6e6e73" text-anchor="start">RECEIVE  (PC → iPhone)</text>
<rect x="20" y="272" width="132" height="74" rx="12" fill="#ffffff" stroke="#d1d1d6" stroke-width="1.2"/><text x="34" y="297" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1c1c1e" text-anchor="start">Paste</text><text x="34" y="318" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">anywhere on</text><text x="34" y="335" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">your iPhone</text>
<rect x="168" y="272" width="140" height="74" rx="12" fill="#ffffff" stroke="#d1d1d6" stroke-width="1.2"/><rect x="180" y="286" width="12" height="12" rx="3" fill="#16C9A6"/><text x="200" y="297" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1c1c1e" text-anchor="start">ECReceive</text><text x="182" y="318" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">Shortcut that asks</text><text x="182" y="335" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">for the PC clipboard</text>
<rect x="472" y="272" width="150" height="74" rx="12" fill="#ffffff" stroke="#d1d1d6" stroke-width="1.2"/><text x="486" y="297" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1c1c1e" text-anchor="start">EasyClipboard</text><text x="486" y="318" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">reads your PC</text><text x="486" y="335" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">clipboard and replies</text>
<rect x="636" y="272" width="124" height="74" rx="12" fill="#ffffff" stroke="#d1d1d6" stroke-width="1.2"/><text x="650" y="297" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1c1c1e" text-anchor="start">Copy</text><text x="650" y="318" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">text or an image</text><text x="650" y="335" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">on your PC</text>
<line x1="636" y1="309" x2="631" y2="309" stroke="#1c1c1e" stroke-width="2"/><path d="M622 309 l10 -5 v10 z" fill="#1c1c1e"/>
<line x1="472" y1="309" x2="317" y2="309" stroke="#007AFF" stroke-width="2"/><path d="M308 309 l10 -5 v10 z" fill="#007AFF"/>
<line x1="168" y1="309" x2="161" y2="309" stroke="#1c1c1e" stroke-width="2"/><path d="M152 309 l10 -5 v10 z" fill="#1c1c1e"/>
<text x="390" y="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#1c1c1e" text-anchor="middle">text or image</text>
<text x="390" y="378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">Every transfer needs your pairing key. History stays on your PC, encrypted. No cloud service.</text>
</svg>
