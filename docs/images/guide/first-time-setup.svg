<text x="58" y="661.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500"><tspan fill="#1c1c1e">Get </tspan><tspan fill="#007AFF">Item at Index</tspan><tspan fill="#1c1c1e"> </tspan><tspan fill="#007AFF">2</tspan><tspan fill="#1c1c1e"> from </tspan><tspan fill="#007AFF">Split Text</tspan></text>
