<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 1108" width="500" height="1108" role="img" aria-label="First time Setup, every action in order">
<rect x="0" y="0" width="500" height="1108" rx="28" fill="#f2f2f7"/>
<text x="250.0" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#1c1c1e" text-anchor="middle">First time Setup</text>
<text x="250.0" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8e8e93" text-anchor="middle">Every action, top to bottom. Numbers match the list below.</text>
