<rect x="36" y="156" width="14" height="14" rx="4" fill="#5856D6"/>
<text x="58" y="167.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500"><tspan fill="#1c1c1e">Open </tspan><tspan fill="#007AFF">Tailscale</tspan></text>
