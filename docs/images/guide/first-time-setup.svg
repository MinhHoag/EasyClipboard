<rect x="36" y="118" width="14" height="14" rx="4" fill="#1c1c1e"/>
<text x="58" y="129.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500"><tspan fill="#1c1c1e">Connect to your Tailscale network</tspan></text>
