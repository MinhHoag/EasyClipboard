<text x="84" y="965.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500"><tspan fill="#1c1c1e">Create folder in </tspan><tspan fill="#007AFF">On My iPhone</tspan><tspan fill="#1c1c1e"> at </tspan><tspan fill="#007AFF">EasyClipboard</tspan></text>
