<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 538" width="500" height="538" role="img" aria-label="ECReceive, every action in order">
<rect x="0" y="0" width="500" height="538" rx="28" fill="#f2f2f7"/>
<text x="250.0" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#1c1c1e" text-anchor="middle">ECReceive</text>
<text x="250.0" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8e8e93" text-anchor="middle">Every action, top to bottom. Numbers match the list below.</text>
<rect x="28" y="110" width="444" height="30" rx="10" fill="#ffffff" stroke="#FF9500" stroke-width="2.5"/>
<rect x="36" y="118" width="14" height="14" rx="4" fill="#5AC8FA"/>
<text x="58" y="129.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500"><tspan fill="#1c1c1e">Get </tspan><tspan fill="#007AFF">EasyClipboardInfo</tspan></text>
<circle cx="486" cy="125.0" r="10" fill="#FF9500"/>
<text x="486" y="129.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<rect x="28" y="148" width="444" height="30" rx="10" fill="#ffffff"/>
<rect x="36" y="156" width="14" height="14" rx="4" fill="#FF9500"/>
<text x="58" y="167.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500"><tspan fill="#1c1c1e">Get Value for </tspan><tspan fill="#007AFF">Auth Key</tspan><tspan fill="#1c1c1e"> in </tspan><tspan fill="#007AFF">EasyClipboardInfo</tspan></text>
<rect x="28" y="186" width="444" height="30" rx="10" fill="#ffffff"/>
<rect x="36" y="194" width="14" height="14" rx="4" fill="#FF9500"/>
<text x="58" y="205.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500"><tspan fill="#1c1c1e">Get Value for </tspan><tspan fill="#007AFF">ReceiveURL</tspan><tspan fill="#1c1c1e"> in </tspan><tspan fill="#007AFF">EasyClipboardInfo</tspan></text>
<rect x="28" y="224" width="444" height="30" rx="10" fill="#ffffff" stroke="#FF9500" stroke-width="2.5"/>
<rect x="36" y="232" width="14" height="14" rx="4" fill="#34C759"/>
<text x="58" y="243.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500"><tspan fill="#1c1c1e">Get contents of </tspan><tspan fill="#007AFF">ReceiveURL</tspan></text>
<circle cx="486" cy="239.0" r="10" fill="#FF9500"/>
<text x="486" y="243.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<rect x="28" y="262" width="444" height="30" rx="10" fill="#ffffff"/>
<rect x="36" y="270" width="14" height="14" rx="4" fill="#8e8e93"/>
<text x="58" y="281.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500"><tspan fill="#1c1c1e">Get type of </tspan><tspan fill="#007AFF">Contents of URL</tspan></text>
<rect x="28" y="300" width="444" height="30" rx="10" fill="#ffffff"/>
<rect x="36" y="308" width="14" height="14" rx="4" fill="#FFCC00"/>
<text x="58" y="319.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500"><tspan fill="#1c1c1e">Show </tspan><tspan fill="#007AFF">Contents of URL</tspan></text>
<rect x="28" y="338" width="444" height="30" rx="10" fill="#ffffff" stroke="#FF9500" stroke-width="2.5"/>
<rect x="36" y="346" width="14" height="14" rx="4" fill="#8e8e93"/>
<text x="58" y="357.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500"><tspan fill="#1c1c1e">If </tspan><tspan fill="#007AFF">Type</tspan><tspan fill="#1c1c1e"> is </tspan><tspan fill="#007AFF">Dictionary</tspan></text>
<circle cx="486" cy="353.0" r="10" fill="#FF9500"/>
<text x="486" y="357.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<line x1="38" y1="368" x2="38" y2="406" stroke="#c7c7cc" stroke-width="2"/>
<rect x="54" y="376" width="418" height="30" rx="10" fill="#ffffff"/>
<rect x="62" y="384" width="14" height="14" rx="4" fill="#FFCC00"/>
<text x="84" y="395.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500"><tspan fill="#1c1c1e">Show alert </tspan><tspan fill="#007AFF">Contents of URL</tspan></text>
<rect x="28" y="414" width="444" height="30" rx="10" fill="#ffffff"/>
<rect x="36" y="422" width="14" height="14" rx="4" fill="#8e8e93"/>
<text x="58" y="433.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500"><tspan fill="#1c1c1e">Otherwise</tspan></text>
<line x1="38" y1="444" x2="38" y2="482" stroke="#c7c7cc" stroke-width="2"/>
<rect x="54" y="452" width="418" height="30" rx="10" fill="#ffffff" stroke="#FF9500" stroke-width="2.5"/>
<rect x="62" y="460" width="14" height="14" rx="4" fill="#007AFF"/>
<text x="84" y="471.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500"><tspan fill="#1c1c1e">Copy </tspan><tspan fill="#007AFF">Contents of URL</tspan><tspan fill="#1c1c1e"> to clipboard</tspan></text>
<circle cx="486" cy="467.0" r="10" fill="#FF9500"/>
<text x="486" y="471.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<rect x="28" y="490" width="444" height="30" rx="10" fill="#ffffff"/>
<rect x="36" y="498" width="14" height="14" rx="4" fill="#8e8e93"/>
<text x="58" y="509.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500"><tspan fill="#1c1c1e">End If</tspan></text>
</svg>
