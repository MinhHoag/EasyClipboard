<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" width="780" height="350" role="img" aria-label="The six setup steps and where each one happens">
<rect width="780" height="350" rx="20" fill="#f2f2f7"/>
<text x="24" y="36" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#6e6e73" text-anchor="start">Before you start: Tailscale on your PC and iPhone, same account</text>
<rect x="24" y="56" width="228" height="92" rx="12" fill="#ffffff" stroke="#FF3B30" stroke-width="2.5"/><text x="38" y="81" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1c1c1e" text-anchor="start">1. Turn on Taildrop</text><text x="38" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">one switch in Tailscale&#x27;s</text><text x="38" y="119" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">admin console, for photos</text><text x="240" y="81" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#8e8e93" text-anchor="end">Tailscale</text>
<line x1="252" y1="102.0" x2="273" y2="102.0" stroke="#1c1c1e" stroke-width="2"/><path d="M282 102.0 l-10 -5 v10 z" fill="#1c1c1e"/>
<rect x="282" y="56" width="228" height="92" rx="12" fill="#ffffff" stroke="#d1d1d6" stroke-width="1.2"/><text x="296" y="81" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1c1c1e" text-anchor="start">2. Show the setup code</text><text x="296" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">EasyClipboard on your PC:</text><text x="296" y="119" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">press ▶, open Pairing / setup</text><text x="498" y="81" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#8e8e93" text-anchor="end">PC</text>
<line x1="510" y1="102.0" x2="531" y2="102.0" stroke="#1c1c1e" stroke-width="2"/><path d="M540 102.0 l-10 -5 v10 z" fill="#1c1c1e"/>
<rect x="540" y="56" width="228" height="92" rx="12" fill="#ffffff" stroke="#FF9500" stroke-width="2.5"/><rect x="552" y="70" width="12" height="12" rx="3" fill="#8893A3"/><text x="572" y="81" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1c1c1e" text-anchor="start">3. First time Setup</text><text x="554" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">install it, pick your PC,</text><text x="554" y="119" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">scan the code on screen</text><text x="756" y="81" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#8e8e93" text-anchor="end">iPhone</text>
<rect x="24" y="208" width="228" height="92" rx="12" fill="#ffffff" stroke="#d1d1d6" stroke-width="1.2"/><rect x="36" y="222" width="12" height="12" rx="3" fill="#8FAE97"/><text x="56" y="233" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1c1c1e" text-anchor="start">4. Install ECSend</text><text x="38" y="254" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">sends your iPhone</text><text x="38" y="271" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">clipboard to the PC</text><text x="240" y="233" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#8e8e93" text-anchor="end">iPhone</text>
<line x1="252" y1="254.0" x2="273" y2="254.0" stroke="#1c1c1e" stroke-width="2"/><path d="M282 254.0 l-10 -5 v10 z" fill="#1c1c1e"/>
<rect x="282" y="208" width="228" height="92" rx="12" fill="#ffffff" stroke="#d1d1d6" stroke-width="1.2"/><rect x="294" y="222" width="12" height="12" rx="3" fill="#16C9A6"/><text x="314" y="233" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1c1c1e" text-anchor="start">5. Install ECReceive</text><text x="296" y="254" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">gets your PC clipboard</text><text x="296" y="271" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">onto the iPhone</text><text x="498" y="233" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#8e8e93" text-anchor="end">iPhone</text>
<line x1="510" y1="254.0" x2="531" y2="254.0" stroke="#1c1c1e" stroke-width="2"/><path d="M540 254.0 l-10 -5 v10 z" fill="#1c1c1e"/>
<rect x="540" y="208" width="228" height="92" rx="12" fill="#ffffff" stroke="#d1d1d6" stroke-width="1.2"/><text x="554" y="233" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1c1c1e" text-anchor="start">6. Test it</text><text x="554" y="254" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">copy, run ECSend,</text><text x="554" y="271" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">press Ctrl+V on the PC</text><text x="756" y="233" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#8e8e93" text-anchor="end">Both</text>
<path d="M654.0 148 v22 H138.0 v12" fill="none" stroke="#1c1c1e" stroke-width="2"/>
<path d="M138.0 208 l-5 -10 h10 z" fill="#1c1c1e"/>
<rect x="24" y="310" width="12" height="12" rx="3" fill="none" stroke="#FF3B30" stroke-width="2.5"/>
<text x="42" y="320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">easy to miss: without it photos never arrive</text>
<rect x="372" y="310" width="12" height="12" rx="3" fill="none" stroke="#FF9500" stroke-width="2.5"/>
<text x="390" y="320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">run once; ECSend and ECReceive use what it saves</text>
</svg>
